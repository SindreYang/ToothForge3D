[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "toothforge3d"
version = "0.1.0"
description = "Multi-condition adapters for dental geometry generation with TRELLIS.2"
requires-python = ">=3.10"
dependencies = ["torch>=2.4"]

[tool.setuptools]
py-modules = ["mcdg"]
